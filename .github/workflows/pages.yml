# Publie la carte publique (lecture seule) sur GitHub Pages.
# Les données viennent de data/public/, mises à jour par scripts/publier.ps1.
name: Carte publique (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "data/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site statique
        env:
          ESPACE_URL: ${{ vars.ESPACE_URL }}
        run: |
          mkdir -p _site/js _site/data
          cp web/index.html _site/
          cp -r web/css _site/
          cp web/js/app.js web/js/adressage-public.js web/js/itineraire.js web/js/selection.js _site/js/
          cp data/public/*.geojson data/public/stats.json _site/data/
          # Mode statique ; lien vers l'espace agents seulement si la variable ESPACE_URL est définie
          printf "window.LABE_CONFIG = { mode: 'static', espaceUrl: '%s' };\n" "$ESPACE_URL" > _site/js/config.js
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
